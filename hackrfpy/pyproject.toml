[project]
name = "hackrfpy"
version = "1.0.0"
description = "A self-contained CLI + scriptable wrapper for the HackRF One, built on the hackrf-tools binaries (no libhackrf bindings required)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE*"]
authors = [{ name = "LC-Linkous" }]
keywords = ["hackrf", "sdr", "rf", "spectrum", "sigmf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# plotting deps for the examples (NOT needed by the library itself).
# matplotlib alone is enough -- it uses a native GUI backend (TkAgg on
# Windows, ships with Python) for the live windows. PyQt5 was dropped: its
# wheels don't resolve cleanly on Windows via uv and it isn't required.
plotting = ["matplotlib"]

[project.scripts]
hrf = "hackrfpy.cli:main"

[project.urls]
Homepage = "https://github.com/LC-Linkous/hackRF_python"
Repository = "https://github.com/LC-Linkous/hackRF_python"
Issues = "https://github.com/LC-Linkous/hackRF_python/issues"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a connected HackRF (self-skip if absent)",
]
testpaths = ["tests"]

[tool.ruff]
# Match the codebase's existing style rather than reformatting it.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default ruleset (pyflakes + a pycodestyle subset). Kept deliberately small:
# this gates CI, so every enabled rule should be one we actually want to block
# a merge on.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# E741 ("ambiguous variable name l"): `l` reads naturally as "line" in the
# sweep-line parsing comprehensions. Cosmetic only, and renaming would churn
# working parser tests.
"tests/test_parsing.py" = ["E741"]
"tests/test_real_output.py" = ["E741"]